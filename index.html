<style>
/* Un seul look assumé : jaune « bande de chantier », encre noire, cartes blanches */
:root{
  --bg:#FFD84D; --ink:#141414; --card:#FFFFFF; --muted:#5A5340; --line:#141414; --hot:#E0362C; --soft:#FFF3C4;
  --display:"Archivo Black", Impact, "Arial Black", sans-serif;
  --body:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:26px}
.tape{font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;text-align:center;background:var(--ink);color:var(--bg);padding:6px 10px;transform:rotate(-1.5deg);justify-self:center}
.photo{justify-self:center;width:min(100%,360px);aspect-ratio:1;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);background:var(--card);transform:rotate(1deg)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,44px);line-height:1.05;text-align:center;margin:0;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--hot)}
form{background:var(--card);border:3px solid var(--ink);padding:14px;display:grid;gap:10px;box-shadow:5px 5px 0 var(--ink)}
label{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase}
.field{display:grid;gap:4px}
textarea,input{font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--ink);border-radius:0;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:84px}
textarea:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row .field{flex:1 1 160px;min-width:0}
.btn{font:400 16px var(--display);text-transform:uppercase;background:var(--hot);color:#fff;border:3px solid var(--ink);padding:10px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--muted);margin:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.msg{font-size:14px;color:var(--hot);font-weight:700;margin:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:22px;margin:0}
.tabs{display:flex;border:2px solid var(--ink)}
.tabs button{font:700 13px var(--body);background:transparent;border:0;padding:5px 10px;cursor:pointer;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:12px}
li{background:var(--card);border:2px solid var(--ink);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
li.top1{border-width:3px;box-shadow:5px 5px 0 var(--hot)}
.txt{font-size:17px;font-weight:500;overflow-wrap:anywhere;min-width:0}
.meta{grid-column:1;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.crown{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--hot);color:#fff;padding:1px 6px}
.lol{grid-column:2;grid-row:1 / span 2;font:700 15px var(--body);display:grid;justify-items:center;gap:0;background:var(--soft);border:2px solid var(--ink);padding:6px 10px;cursor:pointer;min-width:58px;font-variant-numeric:tabular-nums;color:var(--ink)}
.lol .e{font-size:20px;line-height:1}
.lol[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.del{background:none;border:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.empty{border:2px dashed var(--ink);padding:24px 16px;text-align:center}
.empty strong{display:block;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:18px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head>

  <h1>Donnez le pire défaut de ce mec, <em>il faut le rendre humble</em></h1>

  <form id="form" autocomplete="off">
    <div class="field">
      <label for="texte">Son pire défaut</label>
      <textarea id="texte" maxlength="200" placeholder="Il met 45 minutes à choisir un resto…" required></textarea>
    </div>
    <div class="row">
      <div class="field">
        <label for="auteur">Ton prénom</label>
        <input id="auteur" maxlength="30" placeholder="Camille" required>
      </div>
      <button class="btn" id="submit" type="submit">Balancer</button>
    </div>
    <p class="hint"><span id="left">200 caractères max</span></p>
    <p class="msg" id="msg" hidden></p>
  </form>

  <section style="display:grid;gap:14px">
    <div class="head">
      <h2>Le dossier <span id="count"></span></h2>
      <div class="tabs" role="group" aria-label="Trier">
        <button type="button" id="sortTop" aria-pressed="true">Les meilleurs</button>
        <button type="button" id="sortNew" aria-pressed="false">Les derniers</button>
      </div>
    </div>
    <ol id="list"></ol>
    <div class="empty" id="empty"><strong>Le dossier est vide</strong>Pour l'instant il se croit parfait. Écris le premier défaut.</div>
  </section>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const showMsg = t => { $("msg").textContent = t; $("msg").hidden = !t; };
  if (!window.supabase) { showMsg("La bibliothèque Supabase ne s'est pas chargée. Recharge la page."); return; }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const store = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };
  let myId = store.get("roast_id");
  if (!myId) { myId = crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g,()=>(Math.random()*16|0).toString(16)); store.set("roast_id", myId); }
  $("auteur").value = store.get("roast_name") || "";

  let items = [], sort = "top";

  $("texte").addEventListener("input", () => { const n = 200 - $("texte").value.length; $("left").textContent = n + " caractère" + (n>1?"s":"") + " restant" + (n>1?"s":""); });

  function setSort(s){ sort = s; $("sortTop").setAttribute("aria-pressed", s==="top"); $("sortNew").setAttribute("aria-pressed", s==="new"); render(); }
  $("sortTop").onclick = () => setSort("top");
  $("sortNew").onclick = () => setSort("new");

  async function load(){
    const { data, error } = await sb.from("defauts").select("id,texte,auteur,auteur_id,created_at,rires(voter_id)").order("created_at",{ascending:false}).limit(300);
    if (error) { showMsg("Impossible de charger le dossier (" + (error.message || error.code || "erreur inconnue") + ")."); return; }
    showMsg(""); items = data || []; render();
  }

  function ago(iso){
    const s = Math.max(0, (Date.now() - new Date(iso).getTime())/1000);
    if (s < 60) return "à l'instant";
    if (s < 3600) return "il y a " + Math.floor(s/60) + " min";
    if (s < 86400) return "il y a " + Math.floor(s/3600) + " h";
    return new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  }

  function render(){
    const list = items.map(x => ({...x, n:(x.rires||[]).length, mine:(x.rires||[]).some(r=>r.voter_id===myId)}));
    if (sort === "top") list.sort((a,b)=> b.n-a.n || b.created_at.localeCompare(a.created_at));
    const best = list.reduce((m,x)=> x.n>m ? x.n : m, 0);
    $("empty").hidden = list.length > 0;
    $("count").textContent = list.length ? "(" + list.length + ")" : "";
    $("list").replaceChildren(...list.map(x => {
      const li = document.createElement("li");
      if (best > 0 && x.n === best && sort === "top" && x === list[0]) li.className = "top1";
      const t = document.createElement("div"); t.className = "txt"; t.textContent = x.texte;
      const m = document.createElement("div"); m.className = "meta";
      if (li.className) { const c = document.createElement("span"); c.className = "crown"; c.textContent = "Le plus violent"; m.append(c); }
      const a = document.createElement("span"); a.textContent = "— " + x.auteur + " · " + ago(x.created_at); m.append(a);
      if (x.auteur_id === myId) {
        const d = document.createElement("button"); d.className = "del"; d.type = "button"; d.textContent = "Supprimer";
        d.onclick = async () => {
          if (!d.dataset.c) { d.dataset.c = "1"; d.textContent = "Sûr ?"; setTimeout(()=>{ d.dataset.c=""; d.textContent="Supprimer"; }, 3000); return; }
          d.disabled = true;
          const { error } = await sb.from("defauts").delete().eq("id", x.id).eq("auteur_id", myId);
          if (error) { d.disabled = false; showMsg("Suppression impossible (" + error.message + ")."); } else load();
        };
        m.append(d);
      }
      const b = document.createElement("button"); b.type = "button"; b.className = "lol";
      b.setAttribute("aria-pressed", x.mine); b.setAttribute("aria-label", "Ça m'a fait rire");
      const e = document.createElement("span"); e.className = "e"; e.textContent = "😂";
      const n = document.createElement("span"); n.textContent = x.n;
      b.append(e, n);
      b.onclick = () => laugh(x.id, x.mine);
      li.append(t, b, m);
      return li;
    }));
  }

  async function laugh(id, mine){
    const it = items.find(x => x.id === id); if (!it) return;
    it.rires = (it.rires||[]).filter(r => r.voter_id !== myId);
    if (!mine) it.rires.push({voter_id: myId});
    render();
    const { error } = mine
      ? await sb.from("rires").delete().eq("defaut_id", id).eq("voter_id", myId)
      : await sb.from("rires").upsert({defaut_id: id, voter_id: myId}, {onConflict:"defaut_id,voter_id"});
    if (error) { showMsg("Ton 😂 n'a pas été compté (" + error.message + ")."); load(); }
  }

  $("form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const texte = $("texte").value.trim(), auteur = $("auteur").value.trim();
    if (!texte || !auteur) return;
    store.set("roast_name", auteur);
    $("submit").disabled = true; showMsg("");
    const { error } = await sb.from("defauts").insert({texte, auteur, auteur_id: myId});
    $("submit").disabled = false;
    if (error) { showMsg("Pas envoyé (" + error.message + "). Réessaie."); return; }
    $("texte").value = ""; $("left").textContent = "200 caractères max"; setSort("new"); load();
  });

  let t = null; const soon = () => { clearTimeout(t); t = setTimeout(load, 250); };
  sb.channel("roast").on("postgres_changes",{event:"*",schema:"public",table:"defauts"},soon)
    .on("postgres_changes",{event:"*",schema:"public",table:"rires"},soon).subscribe();
  setInterval(load, 30000);
  load();
})();
</script>
</body>
</html>
